<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Grid</title>
    <style>
        /* 0 margin, 0 padding, 100% pure flow */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #262626;
            display: flex;
            justify-content: center;
        }

        /* 470px width - the exact golden ratio for mobile-first feed viewing */
        .feed-container {
            width: 100%;
            max-width: 470px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .post-card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 14px;
            gap: 12px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 2px;
        }
        
        .avatar-inner {
            width: 100%;
            height: 100%;
            background-color: #333;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .username {
            font-size: 14px;
            font-weight: 600;
        }

        /* 1:1 Aspect ratio baby, 100% width, pure math */
        .post-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #efefef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #8e8e8e;
        }

        .post-actions {
            display: flex;
            padding: 12px 14px;
            gap: 16px;
        }

        .action-icon {
            width: 24px;
            height: 24px;
            border: 2px solid #262626;
            border-radius: 50%;
            cursor: pointer;
        }

        .post-details {
            padding: 0 14px 14px 14px;
        }

        .likes {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .caption {
            font-size: 14px;
            line-height: 1.4;
        }

        .caption-user {
            font-weight: 600;
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="feed-container">
        <!-- Post 1 -->
        <article class="post-card">
            <header class="post-header">
                <div class="avatar"><div class="avatar-inner"></div></div>
                <div class="username">user_7734</div>
            </header>
            
            <div class="post-image">
                1080 x 1080 px
            </div>
            
            <div class="post-actions">
                <div class="action-icon"></div> <!-- Like -->
                <div class="action-icon"></div> <!-- Comment -->
                <div class="action-icon"></div> <!-- Share -->
            </div>
            
            <div class="post-details">
                <div class="likes">8,432 likes</div>
                <div class="caption">
                    <span class="caption-user">user_7734</span>
                    Running pure calculations today. No distractions.
                </div>
            </div>
        </article>

        <!-- Post 2 -->
        <article class="post-card">
            <header class="post-header">
                <div class="avatar"><div class="avatar-inner"></div></div>
                <div class="username">logic_99</div>
            </header>
            
            <div class="post-image">
                1080 x 1080 px
            </div>
            
            <div class="post-actions">
                <div class="action-icon"></div>
                <div class="action-icon"></div>
                <div class="action-icon"></div>
            </div>
            
            <div class="post-details">
                <div class="likes">12,041 likes</div>
                <div class="caption">
                    <span class="caption-user">logic_99</span>
                    Grid alignment hitting exactly at the 14px margin. Beautiful.
                </div>
            </div>
        </article>
    </div>

</body>
</html>
